name: Build GTA SA Audio Device Redirect

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Verify
        shell: powershell
        run: |
          if (!(Test-Path "build/Release/AudioDeviceRedirect.asi")) {
            Write-Error "ASI was not produced"
            exit 1
          }

          Write-Host "ASI successfully created."

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-AudioDeviceRedirect-Diagnostic
          path: build/Release/AudioDeviceRedirect.asi
